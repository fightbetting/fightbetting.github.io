<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fight Night — Live Pool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #080c14;
            --surface: rgba(18, 26, 45, 0.85);
            --surface-border: rgba(255, 255, 255, 0.06);
            --text: #e8edf5;
            --text-dim: rgba(232, 237, 245, 0.45);
            --text-muted: rgba(232, 237, 245, 0.6);
            --cyan: #00d4ff;
            --gold: #f0b429;
            --pink: #ff2d78;
            --green: #00e676;
            --red: #ff1744;
            --glass: rgba(255, 255, 255, 0.03);
        }
        html { font-size: 16px; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -20%, rgba(0,212,255,0.08), transparent),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(240,180,41,0.04), transparent),
                radial-gradient(ellipse 50% 40% at 20% 70%, rgba(255,45,120,0.04), transparent);
            pointer-events: none; z-index: 0;
        }
        .container { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 16px 12px 40px; }

        /* Hero */
        .hero { text-align: center; padding: 32px 16px 28px; margin-bottom: 16px; }
        .hero-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 4px; }
        .hero-pool {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3.2rem, 15vw, 5.5rem); line-height: 1;
            background: linear-gradient(135deg, #f0b429 0%, #f7d875 40%, #f0b429 70%, #d4952a 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(240,180,41,0.2));
        }
        @keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .hero-meta { display: flex; justify-content: center; gap: 20px; margin-top: 8px; font-size: 0.75rem; color: var(--text-dim); }
        .hero-meta span { display: flex; align-items: center; gap: 4px; }
        .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 2px; }
        .dot-live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse-dot 2s ease-in-out infinite; }
        .dot-offline { background: var(--red); }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Stats Row */
        .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
        .stat-tile {
            background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border); border-radius: 12px; padding: 12px 8px; text-align: center;
        }
        .stat-tile .num { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; line-height: 1.2; color: var(--cyan); }
        .stat-tile .lbl { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-top: 2px; }

        /* Bettor Strip */
        .bettor-strip {
            display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; margin-bottom: 8px;
            -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
        }
        .bettor-strip::-webkit-scrollbar { display: none; }
        .bettor-mini {
            flex: 0 0 auto; scroll-snap-align: start;
            background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border); border-radius: 10px; padding: 10px 14px; min-width: 100px; text-align: center;
        }
        .bettor-mini .initials {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 4px;
            font-weight: 700; font-size: 0.75rem; color: #fff;
        }
        .bettor-mini .bm-name { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bettor-mini .bm-net { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; }
        .bm-profit { color: var(--green); } .bm-loss { color: var(--red); } .bm-even { color: var(--text-dim); }

        /* Fight Cards */
        .fight-card {
            background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border); border-radius: 16px; padding: 20px 16px; margin-bottom: 14px;
            position: relative; overflow: hidden;
        }
        .fight-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.5;
        }
        .fc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .fc-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); }
        .fc-badge { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; padding: 3px 8px; border-radius: 20px; font-weight: 700; }
        .badge-pending { background: rgba(255,255,255,0.04); color: var(--text-dim); border: 1px solid rgba(255,255,255,0.08); }
        .badge-won-a { background: rgba(0,212,255,0.12); color: var(--cyan); border: 1px solid rgba(0,212,255,0.25); }
        .badge-won-b { background: rgba(240,180,41,0.12); color: var(--gold); border: 1px solid rgba(240,180,41,0.25); }
        .badge-refund { background: rgba(240,180,41,0.08); color: var(--gold); border: 1px solid rgba(240,180,41,0.15); }

        .fc-fighters { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-bottom: 14px; }
        .fc-fighter { text-align: center; }
        .fc-fighter .fn { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; line-height: 1.2; }
        .fc-fighter .fodds { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .fc-fighter .famount { font-size: 0.75rem; font-weight: 700; margin-top: 2px; }
        .fc-vs { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); padding: 0 4px; }

        .fc-total { text-align: center; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 10px; }
        .fc-total strong { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--text); letter-spacing: 0; }

        .fc-bar-wrap { margin-bottom: 12px; }
        .fc-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.04); }
        .fc-bar .seg { transition: width 0.8s cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
        .seg-a { background: linear-gradient(135deg, var(--cyan), #0091ea); }
        .seg-b { background: linear-gradient(135deg, var(--gold), #e6a020); }

        .fc-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .pie-wrap { display: flex; flex-direction: column; align-items: center; }
        .pie { width: 80px; height: 80px; border-radius: 50%; position: relative; flex-shrink: 0; }
        .pie-labels { display: flex; gap: 8px; margin-top: 6px; font-size: 0.6rem; }
        .pie-labels span { display: flex; align-items: center; gap: 3px; }
        .pie-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

        .breakdown-col { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .bd-row { display: flex; justify-content: space-between; font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; }
        .bd-row .bd-name { color: var(--text-muted); }
        .bd-row .bd-amt { font-weight: 700; }
        .bd-winner { background: rgba(0,230,118,0.06); }

        .fc-bettor-list { border-top: 1px solid var(--surface-border); padding-top: 10px; }
        .fc-bettor-list .bbl-title { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; }
        .bbl-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .bbl-row:last-child { border-bottom: none; }
        .bbl-row .bbl-name { display: flex; align-items: center; gap: 6px; }
        .bbl-row .bbl-initials { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; color: #fff; flex-shrink: 0; }
        .bbl-row .bbl-amt { font-weight: 700; }
        .bbl-pick-a { color: var(--cyan); } .bbl-pick-b { color: var(--gold); }

        /* Ledger */
        .ledger-card {
            background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border); border-radius: 16px; padding: 20px 16px; margin-bottom: 14px;
        }
        .ledger-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 12px; }
        .l-row { display: grid; grid-template-columns: 1fr 60px 60px 60px; gap: 4px; padding: 8px 4px; font-size: 0.75rem; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .l-row:last-child { border-bottom: none; }
        .l-header { color: var(--text-dim); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; padding: 6px 4px; border-bottom: 1px solid var(--surface-border); }
        .l-name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .l-name .l-init { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; color: #fff; flex-shrink: 0; }
        .l-paid { text-align: right; color: var(--text-muted); } .l-won { text-align: right; font-weight: 700; } .l-net { text-align: right; font-weight: 700; }
        .l-profit { color: var(--green); } .l-loss { color: var(--red); } .l-even { color: var(--text-dim); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty-state .big-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
        .offline-overlay { text-align: center; padding: 80px 20px; }
        .offline-overlay .big-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.4; }
        .offline-overlay h2 { color: var(--text-dim); font-size: 1.2rem; font-weight: 400; margin-bottom: 6px; }
        .offline-overlay p { color: var(--text-dim); font-size: 0.8rem; opacity: 0.6; }

        footer { text-align: center; font-size: 0.6rem; color: var(--text-dim); padding: 20px 0; letter-spacing: 1px; text-transform: uppercase; }

        /* Animations */
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .hero { animation: fadeUp 0.6s ease-out; }
        .stats-row { animation: fadeUp 0.6s ease-out 0.1s both; }
        .bettor-strip { animation: fadeUp 0.6s ease-out 0.15s both; }
        .fight-card:nth-of-type(1) { animation: fadeUp 0.6s ease-out 0.2s both; }
        .fight-card:nth-of-type(2) { animation: fadeUp 0.6s ease-out 0.3s both; }
        .fight-card:nth-of-type(3) { animation: fadeUp 0.6s ease-out 0.4s both; }
        .ledger-card { animation: fadeUp 0.6s ease-out 0.5s both; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="empty-state" id="loadingState">
        <div class="big-icon">&#9203;</div>
        <p>Loading pool data...</p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://vcstmrxydvubjpfcdsay.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_UF-hirQu6vhdEjUCNplR2A_9fKeYbj_';

    const COLORS = ['#00d4ff','#f0b429','#ff2d78','#00e676','#7c4dff','#ff9100','#e040fb','#00bfa5'];

    function hashColor(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
        return COLORS[Math.abs(h) % COLORS.length];
    }

    async function loadData() {
        const app = document.getElementById('app');
        try {
            const resp = await fetch(
                SUPABASE_URL + '/rest/v1/pool_state?id=eq.1&select=data',
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            );
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const rows = await resp.json();
            if (!rows || rows.length === 0) throw new Error('Empty');
            const state = rows[0].data;
            if (!state || state.offline === true) {
                app.innerHTML = '<div class="offline-overlay"><div class="big-icon">&#128683;</div><h2>Feed Offline</h2><p>The admin has not started the live feed.<br>Check back later.</p></div>';
                return;
            }
            app.innerHTML = renderDashboard(state);
        } catch (e) {
            app.innerHTML = '<div class="offline-overlay"><div class="big-icon">&#9888;</div><h2>Cannot Connect</h2><p style="font-size:0.85rem;opacity:0.6;">' + e.message + '</p></div>';
        }
    }

    function renderDashboard(data) {
        const fights = data.fights || [];
        const bets = data.bets || [];
        const bettors = data.bettors || [];
        const totalPool = data.totalPool || 0;

        const fightStats = fights.map(f => {
            const fb = bets.filter(b => b.fightId === f.id);
            const aBets = fb.filter(b => b.fighter === 'A');
            const bBets = fb.filter(b => b.fighter === 'B');
            const aTotal = aBets.reduce((s, b) => s + b.amount, 0);
            const bTotal = bBets.reduce((s, b) => s + b.amount, 0);
            const fightTotal = aTotal + bTotal;
            return { f, aBets, bBets, aTotal, bTotal, fightTotal,
                     aPct: fightTotal ? (aTotal/fightTotal*100) : 0,
                     bPct: fightTotal ? (bTotal/fightTotal*100) : 0,
                     aCount: aBets.length, bCount: bBets.length };
        });

        const totalBettors = new Set(bets.map(b => b.bettor)).size;
        const totalBets = bets.length;
        const avgBet = totalBets ? (totalPool / totalBets) : 0;
        const biggestFight = fightStats.reduce((m, f) => f.fightTotal > m.fightTotal ? f : m, fightStats[0] || {fightTotal:0});

        let html = '';

        // Hero
        html += '<div class="hero"><div class="hero-label">Total Cash in the Pool</div>';
        html += '<div class="hero-pool">$' + totalPool + '</div>';
        html += '<div class="hero-meta">';
        html += '<span><span class="dot dot-live"></span>Live</span>';
        html += '<span>' + totalBettors + ' bettor' + (totalBettors!==1?'s':'') + '</span>';
        html += '<span>' + totalBets + ' ticket' + (totalBets!==1?'s':'') + '</span></div></div>';

        // Stat tiles
        html += '<div class="stats-row">';
        html += '<div class="stat-tile"><div class="num">' + totalBettors + '</div><div class="lbl">Bettors</div></div>';
        html += '<div class="stat-tile"><div class="num">$' + (avgBet.toFixed(0)) + '</div><div class="lbl">Avg Bet</div></div>';
        html += '<div class="stat-tile"><div class="num">$' + (biggestFight.fightTotal||0) + '</div><div class="lbl">Biggest Fight</div></div>';
        html += '</div>';

        // Bettor strip
        if (bettors.length > 0) {
            const sorted = [...bettors].sort((a,b) => b.paid - a.paid);
            html += '<div class="bettor-strip">';
            sorted.forEach(b => {
                const nc = b.net > 0 ? 'bm-profit' : (b.net < 0 ? 'bm-loss' : 'bm-even');
                const sign = b.net > 0 ? '+' : '';
                const c = hashColor(b.name);
                html += '<div class="bettor-mini"><div class="initials" style="background:'+c+'">'+b.name.charAt(0).toUpperCase()+'</div>';
                html += '<div class="bm-name">'+b.name+'</div>';
                html += '<div class="bm-net '+nc+'">'+sign+'$'+b.net+'</div></div>';
            });
            html += '</div>';
        }

        // Fight cards
        fightStats.forEach(fs => {
            const f = fs.f;
            let badgeCls = 'badge-pending', badgeText = 'Pending';
            if (f.status === 'A') { badgeCls = 'badge-won-a'; badgeText = f.nameA + ' Won'; }
            else if (f.status === 'B') { badgeCls = 'badge-won-b'; badgeText = f.nameB + ' Won'; }
            else if (f.status === 'refund') { badgeCls = 'badge-refund'; badgeText = 'Draw / Refund'; }

            const aColor = hashColor(f.nameA);
            const bColor = hashColor(f.nameB);

            html += '<div class="fight-card">';
            html += '<div class="fc-header"><div class="fc-title">Fight ' + f.id + '</div><div class="fc-badge ' + badgeCls + '">' + badgeText + '</div></div>';
            html += '<div class="fc-fighters">';
            html += '<div class="fc-fighter"><div class="fn" style="color:'+aColor+'">'+f.nameA+'</div><div class="fodds">'+f.probA+'%</div><div class="famount" style="color:'+aColor+'">$'+fs.aTotal+'</div></div>';
            html += '<div class="fc-vs">vs</div>';
            html += '<div class="fc-fighter"><div class="fn" style="color:'+bColor+'">'+f.nameB+'</div><div class="fodds">'+f.probB+'%</div><div class="famount" style="color:'+bColor+'">$'+fs.bTotal+'</div></div>';
            html += '</div>';

            if (fs.fightTotal > 0) {
                html += '<div class="fc-total">Total on this fight: <strong>$'+fs.fightTotal+'</strong></div>';
                const aBar = Math.max(fs.aPct, 2);
                const bBar = Math.max(fs.bPct, 2);
                html += '<div class="fc-bar-wrap"><div class="fc-bar">';
                if (fs.aTotal > 0) html += '<div class="seg seg-a" style="width:'+aBar+'%">'+(fs.aPct>15?'$'+fs.aTotal:'')+'</div>';
                if (fs.bTotal > 0) html += '<div class="seg seg-b" style="width:'+bBar+'%">'+(fs.bPct>15?'$'+fs.bTotal:'')+'</div>';
                html += '</div></div>';

                html += '<div class="fc-charts">';
                html += '<div class="pie-wrap"><div class="pie" style="background:conic-gradient('+aColor+' 0% '+fs.aPct+'%, '+bColor+' '+fs.aPct+'% 100%)"></div>';
                html += '<div class="pie-labels"><span><span class="pie-dot" style="background:'+aColor+'"></span>'+fs.aCount+' bet'+(fs.aCount!==1?'s':'')+'</span>';
                html += '<span><span class="pie-dot" style="background:'+bColor+'"></span>'+fs.bCount+' bet'+(fs.bCount!==1?'s':'')+'</span></div></div>';

                const allFB = [...fs.aBets, ...fs.bBets].sort((a,b) => b.amount - a.amount);
                html += '<div class="breakdown-col">';
                allFB.slice(0,6).forEach(b => {
                    const iw = f.status === b.fighter;
                    const cls = (f.status!=='pending' && f.status!=='refund') ? (iw ? 'bd-winner' : '') : '';
                    html += '<div class="bd-row '+cls+'"><span class="bd-name"><span style="color:'+(b.fighter==='A'?aColor:bColor)+'">&#9679;</span> '+b.bettor+'</span>';
                    html += '<span class="bd-amt" style="color:'+(b.fighter==='A'?aColor:bColor)+'">$'+b.amount+'</span></div>';
                });
                if (allFB.length > 6) html += '<div style="font-size:0.6rem;color:var(--text-dim);text-align:center;">+'+(allFB.length-6)+' more</div>';
                html += '</div></div>';

                html += '<div class="fc-bettor-list"><div class="bbl-title">Bets &mdash; who picked who</div>';
                allFB.forEach(b => {
                    const c = hashColor(b.bettor);
                    const pc = b.fighter === 'A' ? 'bbl-pick-a' : 'bbl-pick-b';
                    html += '<div class="bbl-row"><span class="bbl-name"><span class="bbl-initials" style="background:'+c+'">'+b.bettor.charAt(0).toUpperCase()+'</span>'+b.bettor+'</span>';
                    html += '<span class="bbl-amt '+pc+'">$'+b.amount+' on '+(b.fighter==='A'?'&#8593;':'&#8595;')+'</span></div>';
                });
                html += '</div>';
            } else {
                html += '<div style="text-align:center;color:var(--text-dim);font-size:0.8rem;padding:12px 0;">No bets on this fight yet</div>';
            }
            html += '</div>';
        });

        // Ledger
        if (bettors.length > 0) {
            html += '<div class="ledger-card"><div class="ledger-title">All Bettors</div>';
            html += '<div class="l-row l-header"><div class="l-name">Name</div><div class="l-paid">Paid</div><div class="l-won">Won</div><div class="l-net">Net</div></div>';
            bettors.forEach(b => {
                const nc = b.net > 0 ? 'l-profit' : (b.net < 0 ? 'l-loss' : 'l-even');
                const sign = b.net > 0 ? '+' : '';
                const c = hashColor(b.name);
                html += '<div class="l-row"><div class="l-name"><span class="l-init" style="background:'+c+'">'+b.name.charAt(0).toUpperCase()+'</span>'+b.name+'</div>';
                html += '<div class="l-paid">$'+b.paid+'</div><div class="l-won l-profit">$'+b.won+'</div>';
                html += '<div class="l-net '+nc+'">'+sign+'$'+b.net+'</div></div>';
            });
            html += '</div>';
        }

        html += '<footer>Fight Night Tracker &middot; Refreshes every 15s</footer>';
        return html;
    }

    loadData();
    setInterval(loadData, 15000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Fight Night — Live Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d14;--card:#14141f;--border:#1e1e2d;--text:#e2e2ea;--dim:#6b6b80;--gold:#f0b429;--green:#22c55e}
html{font-size:16px}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.container{max-width:560px;margin:0 auto;padding:12px 10px 32px}

.h-box{text-align:center;padding:24px 12px 20px;margin-bottom:10px}
.h-label{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:var(--dim);margin-bottom:2px}
.h-pool{font-family:'Barlow Condensed',sans-serif;font-size:clamp(3rem,14vw,5rem);line-height:1;font-weight:900;color:var(--gold);letter-spacing:-1px}
.h-meta{display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:.7rem}
.h-meta span{display:flex;align-items:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot-on{background:var(--green);box-shadow:0 0 6px var(--green)}.dot-off{background:#ef4444}

.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:10px}
.qs .qs-cell{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 4px;text-align:center}
.qs .qn{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800;line-height:1.2;color:var(--text)}
.qs .ql{font-size:.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-top:1px}

.bs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px}
.bs::-webkit-scrollbar{display:none}
.bm{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:80px;text-align:center}
.bm .bi{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-weight:700;font-size:.65rem;color:#fff}
.bm .bn{font-size:.6rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .bv{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700}
.g{color:var(--green)}.w{color:var(--gold)}.n{color:var(--dim)}

.fc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 12px;margin-bottom:10px}
.fc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fc-h .fc-t{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim)}
.fc-h .fc-q{font-size:.6rem;color:var(--dim);background:rgba(255,255,255,.03);padding:2px 8px;border-radius:12px;border:1px solid var(--border)}
.fc-bad{font-size:.55rem;padding:2px 8px;border-radius:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.bad-p{background:rgba(255,255,255,.03);color:var(--dim);border:1px solid var(--border)}
.bad-w{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}

.fc-f{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center;margin-bottom:8px}
.fc-f .ff{text-align:center}
.fc-f .ff .fn{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:800;line-height:1.1;color:var(--text)}
.fc-f .ff .fo{font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.fc-f .ff .fd{font-size:.7rem;font-weight:600;margin-top:1px}
.fc-v{font-size:.5rem;text-transform:uppercase;letter-spacing:2px;color:var(--dim)}

.fc-bar{margin-bottom:8px}
.bar{display:flex;height:20px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.03)}
.bar .s{transition:width .8s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.fc-tot{text-align:center;font-size:.6rem;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fc-tot b{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;color:var(--text);font-weight:700}

.pie-legend-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-bottom:8px}
.legend-col{font-size:.6rem;flex:1;min-width:140px}
.legend-header{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.ld-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.ld-dot.sm{width:5px;height:5px}
.ld-amt{margin-left:auto;color:var(--text);font-weight:600}
.legend-row{display:flex;align-items:center;gap:4px;padding:1px 0 1px 10px}
.ld-name{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld-val{font-weight:600}

.fc-b{border-top:1px solid var(--border);padding-top:8px}
.fc-b .b-title{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:4px}
.fc-b .b-title-sub{font-weight:400;text-transform:none;letter-spacing:0;color:var(--dim)}
.br{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:5px 0;font-size:.7rem;align-items:center;border-bottom:1px solid rgba(255,255,255,.02)}
.br:last-child{border-bottom:none}
.br .bri{display:flex;align-items:center;gap:4px}
.br .bri .bri-d{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0}
.br .brr{text-align:right;font-size:.6rem;color:var(--text);font-weight:500}
.br .brp{text-align:right;font-weight:600;font-size:.65rem;white-space:nowrap}
.brp-pred{color:var(--green);font-weight:700}
.brp-sep{color:var(--dim);padding:0 2px}
.brp-range{color:var(--gold);font-weight:700}

.lc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 12px;margin-bottom:10px}
.lc .lt{font-size:.55rem;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:8px}
.lr{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:6px 2px;font-size:.7rem;align-items:center;border-bottom:1px solid rgba(255,255,255,.02)}
.lr:last-child{border-bottom:none}.lh{color:var(--dim);font-size:.5rem;text-transform:uppercase;letter-spacing:1px;padding:4px 2px;border-bottom:1px solid var(--border)}
.ln{font-weight:500;display:flex;align-items:center;gap:4px}
.ln .ld{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700;color:#fff;flex-shrink:0}
.lp{text-align:right;color:var(--text)}.lw{text-align:right;font-weight:600;color:var(--text)}.lv{text-align:right;font-weight:700}
.gc{color:var(--green)}.wc{color:var(--gold)}.nc{color:var(--dim)}.rc{color:#ef4444}

.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty .ei{font-size:2.5rem;margin-bottom:10px;opacity:.4}
.off{text-align:center;padding:80px 20px}
.off .ei{font-size:3.5rem;margin-bottom:12px;opacity:.4}
.off h2{font-size:1.1rem;font-weight:400;margin-bottom:4px;color:var(--text)}
.off p{color:var(--dim);font-size:.8rem;opacity:.6}
.empty-fight{text-align:center;color:var(--dim);font-size:.75rem;padding:8px 0}

footer{text-align:center;font-size:.5rem;color:var(--dim);padding:16px 0;text-transform:uppercase;letter-spacing:2px}
</style>
</head>
<body>
<div class="container" id="app"><div class="empty"><div class="ei">&#9203;</div><p>Loading pool data...</p></div></div>

<!-- Bet Calculator Modal -->
<div id="betModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 20px;max-width:380px;width:100%;position:relative;max-height:90vh;overflow-y:auto;">
    <button onclick="closeBetCalc()" style="position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:1.3rem;cursor:pointer;padding:4px;">✕</button>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:10px;">Test a Bet</div>

    <div style="margin-bottom:10px;">
      <label style="font-size:.7rem;color:var(--dim);display:block;margin-bottom:3px;">Select Fight</label>
      <select id="modalFightSelect" onchange="modalFightChange()" style="width:100%;padding:8px 10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:.85rem;font-family:'Outfit',sans-serif;"></select>
    </div>
    <div id="modalOdds" style="font-size:.7rem;color:var(--dim);margin-bottom:10px;text-align:center;"></div>

    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button id="modalPickA" onclick="modalPick('A')" style="flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer;transition:all .15s;"></button>
      <button id="modalPickB" onclick="modalPick('B')" style="flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer;transition:all .15s;"></button>
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-size:.7rem;color:var(--dim);display:block;margin-bottom:4px;">Amount ($)</label>
      <input id="modalAmount" type="number" min="1" step="1" value="5" oninput="modalCalc()" style="width:100%;padding:10px 12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:1rem;font-family:'Barlow Condensed',sans-serif;">
    </div>

    <div id="modalResults" style="display:none;background:rgba(255,255,255,.03);border-radius:8px;padding:12px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:6px;"><span style="color:var(--dim)">Estimated Payout</span><span id="modalPred" style="font-weight:700;color:var(--green)"></span></div>
      <div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:6px;"><span style="color:var(--dim)">Win Range</span><span id="modalRange" style="font-weight:700;color:var(--gold)"></span></div>
      <div style="display:flex;justify-content:space-between;font-size:.75rem;"><span style="color:var(--dim)">Current Pool</span><span id="modalPool" style="font-weight:600;color:var(--text)"></span></div>
    </div>

    <div id="modalWarnings" style="font-size:.65rem;line-height:1.5;"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://vcstmrxydvubjpfcdsay.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_UF-hirQu6vhdEjUCNplR2A_9fKeYbj_';

const FCOLORS={christian:'#2563eb',julia:'#fb7185',aliya:'#a855f7',marissa:'#ec4899',yes:'#22c55e',no:'#ef4444'};
function fcolor(n){
  const k=n.toLowerCase();
  if(FCOLORS[k])return FCOLORS[k];
  let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);
  return['#2563eb','#fb7185','#a855f7','#ec4899','#22c55e','#ef4444','#f59e0b','#06b6d4'][Math.abs(h)%8];
}
function bettorColor(n){
  let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);
  h=Math.abs(h);return 'hsl('+((h*137.508)%360)+','+(72+(h%20))+'%,'+(48+(Math.floor(h/7)%14))+'%)';
}

function computePayouts(fights,bets){
  const tc=bets.reduce((s,b)=>s+b.amount,0);
  const ar=fights.every(f=>f.status!=='pending');
  const exp=bets.map(b=>{
    const f=fights.find(x=>x.id===b.fightId),p=b.fighter==='A'?f.probA:f.probB,w=1/(p/100);
    let e=0,win=false,ref=false;
    if(f.status==='refund'){e=b.amount;ref=true;}else if(f.status===b.fighter){e=b.amount*w;win=true;}
    return{bettor:b.bettor,amount:b.amount,expected:e,isWinner:win,isRefund:ref};
  });
  const ld={};
  exp.forEach(p=>{if(!ld[p.bettor])ld[p.bettor]={paid:0,raw:0,final:0};ld[p.bettor].paid+=p.amount;if(p.isRefund)ld[p.bettor].raw+=p.amount;else if(p.isWinner&&!ar)ld[p.bettor].raw+=p.expected;});
  if(ar&&bets.length>0){
    let tr=0,rp={},ws={},ww={};
    exp.forEach(p=>{if(p.isRefund){tr+=p.amount;rp[p.bettor]=(rp[p.bettor]||0)+p.amount;}else if(p.isWinner){ws[p.bettor]=(ws[p.bettor]||0)+p.amount;ww[p.bettor]=(ww[p.bettor]||0)+p.expected;}});
    const pf=tc-tr,ts=Object.values(ws).reduce((s,v)=>s+v,0),tw=Object.values(ww).reduce((s,v)=>s+v,0);
    if(ts===0&&tr===0){Object.keys(ld).forEach(n=>ld[n].raw=ld[n].paid);}
    else{
      const al={};Object.keys(ws).forEach(n=>al[n]=0);
      if(ts>0){if(pf>=ts)Object.keys(ws).forEach(n=>al[n]=ws[n]);else{const r=pf/ts;Object.keys(ws).forEach(n=>al[n]=Math.floor(ws[n]*r));}}
      let u=Object.values(al).reduce((s,v)=>s+v,0),l=pf-u;
      if(l>0&&tw>0)Object.keys(ww).forEach(n=>al[n]+=l*(ww[n]/tw));
      Object.keys(rp).forEach(n=>{if(!al[n])al[n]=0;al[n]+=rp[n];});
      Object.keys(al).forEach(n=>ld[n].raw=al[n]);
    }
    let eb=[],sf=0;
    Object.keys(ld).forEach(n=>{if(ld[n].raw>0){let f=Math.floor(ld[n].raw),r=ld[n].raw-f;sf+=f;eb.push({name:n,fl:f,rem:r});}else ld[n].final=0;});
    let lo=tc-sf;eb.sort((a,b)=>b.rem-a.rem);
    for(let i=0;i<lo&&i<eb.length;i++)eb[i].fl+=1;
    eb.forEach(e=>ld[e.name].final=e.fl);
  }
  const res={};
  Object.keys(ld).forEach(n=>{const d=ld[n],won=ar?d.final:d.raw;res[n]={paid:d.paid,won:Math.round(won),net:Math.round(won-d.paid)};});
  return res;
}

function computeRanges(bets,fights){
  const rm={},by={};
  bets.forEach(b=>{(by[b.bettor]=by[b.bettor]||[]).push(b);});
  const pf=fights.filter(f=>f.status==='pending');
  const scenarios=pf.length?Math.pow(2,pf.length):1;
  const names=Object.keys(by);
  const allValues={};
  names.forEach(n=>{rm[n]={min:0,max:0,est:0};allValues[n]=[];});
  for(let s=0;s<scenarios;s++){
    const modFights=fights.map(f=>{
      if(f.status!=='pending')return f;
      const idx=pf.findIndex(p=>p.id===f.id);
      return{...f,status:s&(1<<idx)?'A':'B'};
    });
    const payouts=computePayouts(modFights,bets);
    names.forEach(n=>{
      const p=payouts[n]||{won:0};
      allValues[n].push(p.won);
      if(s===0)rm[n].est=p.won;
    });
  }
  names.forEach(n=>{
    rm[n].max=Math.max(...allValues[n],0);
    const nonZero=allValues[n].filter(v=>v>0).sort((a,b)=>a-b);
    rm[n].min=nonZero.length?nonZero[0]:0;
  });
  return rm;
}

function renderHero(pool,bettors,totalBets,avg,fightsData){
  const btn = `<button onclick="openBetCalc()" style="position:absolute;top:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-size:.65rem;cursor:pointer;font-family:'Outfit',sans-serif;">Test Bet</button>`;
  return `<div class="h-box" style="position:relative">${btn}<div class="h-label">Total Cash in the Pool</div><div class="h-pool">$${pool}</div><div class="h-meta"><span><span class="dot dot-on"></span>Live</span><span>${bettors} bettor${bettors!==1?'s':''}</span><span>${totalBets} total bets</span><span>$${avg} avg</span></div></div>`;
}
function renderStatsRow(fs,bs){
  const bb=bs.reduce((m,b)=>b.paid>(m.paid||0)?b:m,bs[0]||{});
  if(!bb.name)return'';
  return `<div class="qs"><div class="qs-cell" style="grid-column:1/-1"><div style="display:flex;justify-content:center;align-items:center;gap:12px;padding:4px 0">
    <span class="ld" style="width:28px;height:28px;font-size:.7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:${bettorColor(bb.name)}">${bb.name.charAt(0).toUpperCase()}</span>
    <span style="text-align:left"><div style="font-size:.8rem;font-weight:600;color:var(--text)">${bb.name}</div><div class="ql" style="font-size:.55rem;text-align:left">Top Bettor</div></span>
    <span style="text-align:center;padding:0 8px"><div class="qn" style="font-size:1.1rem">$${bb.paid}</div><div class="ql" style="font-size:.5rem">Paid In</div></span>
  </div></div></div>`;
}
function renderBettorStrip(bs){
  if(!bs.length)return'';
  const s=[...bs].sort((a,b)=>b.paid-a.paid);
  return '<div class="bs">'+s.map(b=>{const dc=b.net>0?'g':(b.net<0?'n':'n'),sg=b.net>0?'+':'';return`<div class="bm"><div class="bi" style="background:${bettorColor(b.name)}">${b.name.charAt(0).toUpperCase()}</div><div class="bn">${b.name}</div><div class="bv ${dc}">${sg}$${Math.abs(b.net)}</div></div>`;}).join('')+'</div>';
}
function renderFightCard(fs,rm){
  const f=fs.f,ac=fcolor(f.nameA),bc=fcolor(f.nameB),q=f.id===3?'Survives the round?':'Who wins?';
  let badge='<span class="bad-p">Pending</span>';
  if(f.status==='A')badge='<span class="bad-w">'+f.nameA+' Won</span>';
  else if(f.status==='B')badge='<span class="bad-w" style="border-color:rgba(240,180,41,.2);color:var(--gold);background:rgba(240,180,41,.1)">'+f.nameB+' Won</span>';
  else if(f.status==='refund')badge='<span class="bad-p">Draw / Refund</span>';
  let h=`<div class="fc"><div class="fc-h"><span class="fc-t">Fight ${f.id}</span><span class="fc-q">${q}</span>${badge}</div><div class="fc-f"><div class="ff"><div class="fn" style="color:${ac}">${f.nameA}</div><div class="fo">${f.probA}%</div><div class="fd" style="color:${ac}">$${fs.aT}</div></div><div class="fc-v">vs</div><div class="ff"><div class="fn" style="color:${bc}">${f.nameB}</div><div class="fo">${f.probB}%</div><div class="fd" style="color:${bc}">$${fs.bT}</div></div></div>`;
  if(fs.fT>0){
    const ap=Math.max(fs.aP,3),bp=Math.max(fs.bP,3);
    h+=`<div class="fc-tot">Total on this fight: <b>$${fs.fT}</b></div><div class="fc-bar"><div class="bar">`;
    if(fs.aT>0)h+=`<div class="s" style="width:${ap}%;background:${ac}">${fs.aP>12?'$'+fs.aT:''}</div>`;
    if(fs.bT>0)h+=`<div class="s" style="width:${bp}%;background:${bc}">${fs.bP>12?'$'+fs.bT:''}</div>`;
    h+=`</div></div>`;
    const aB=[...fs.ab].sort((a,b)=>b.amount-a.amount),bB=[...fs.bb].sort((a,b)=>b.amount-a.amount);
    const cx=65,cy=65,R=58;let ca=-90;
    let slices=[];aB.forEach(b=>slices.push({...b,col:bettorColor(b.bettor)}));bB.forEach(b=>slices.push({...b,col:bettorColor(b.bettor)}));
    let svg=`<svg viewBox="0 0 130 130" width="130" height="130">`;
    slices.forEach(s=>{const a=fs.fT?(s.amount/fs.fT)*360:0;if(!a)return;const sr=(ca*Math.PI)/180,er=((ca+a)*Math.PI)/180;svg+=`<path d="M${cx} ${cy} L${cx+R*Math.cos(sr)} ${cy+R*Math.sin(sr)} A${R} ${R} 0 ${a>180?1:0} 1 ${cx+R*Math.cos(er)} ${cy+R*Math.sin(er)} Z" fill="${s.col}" opacity=".85" stroke="#14141f" stroke-width="1"/>`;ca+=a;});
    const tc=aB.length+bB.length;
    svg+=`<circle cx="${cx}" cy="${cy}" r="22" fill="#14141f"/><text x="${cx}" y="${cy-3}" text-anchor="middle" fill="#e2e2ea" font-size="16" font-weight="800" font-family="'Barlow Condensed',sans-serif">${tc}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#6b6b80" font-size="8">bets</text></svg>`;
    h+=`<div class="pie-legend-wrap">${svg}<div class="legend-col">`;
    h+=`<div class="legend-header"><span class="ld-dot" style="background:${ac}"></span><b style="color:${ac}">${f.nameA}</b><span class="ld-amt" style="font-weight:900;font-size:.95rem;color:${ac}">$${fs.aT}</span></div>`;
    aB.forEach(b=>{const c=bettorColor(b.bettor);h+=`<div class="legend-row"><span class="ld-dot sm" style="background:${c}"></span><span class="ld-name">${b.bettor}</span><span class="ld-val" style="font-weight:600;font-size:.65rem">$${b.amount}</span></div>`;});
    h+=`<div class="legend-header" style="margin-top:4px"><span class="ld-dot" style="background:${bc}"></span><b style="color:${bc}">${f.nameB}</b><span class="ld-amt" style="font-weight:900;font-size:.95rem;color:${bc}">$${fs.bT}</span></div>`;
    bB.forEach(b=>{const c=bettorColor(b.bettor);h+=`<div class="legend-row"><span class="ld-dot sm" style="background:${c}"></span><span class="ld-name">${b.bettor}</span><span class="ld-val" style="font-weight:600;font-size:.65rem">$${b.amount}</span></div>`;});
    h+=`</div></div>`;
    h+=`<div class="fc-b"><div class="b-title">Estimated Payout Range <span class="b-title-sub">per bettor across all fight outcomes</span></div>`;
    [...slices].sort((a,b)=>b.amount-a.amount).forEach(b=>{
      const rr=rm[b.bettor]||{min:0,max:0},c=bettorColor(b.bettor);
      const fname=b.side==='A'?f.nameA:f.nameB;
      h+=`<div class="br" style="grid-template-columns:1fr auto auto;gap:6px"><div class="bri"><span class="bri-d" style="background:${c}"></span>${b.bettor}</div>
      <div style="font-size:.65rem;color:var(--text);white-space:nowrap">$${b.amount} on ${fname}</div>
      <div style="font-size:.65rem;white-space:nowrap"><span class="brp-sep">Paying:</span> <span class="brp-range">$${rr.min}</span><span class="brp-sep">&ndash;</span><span class="brp-range">$${rr.max}</span></div></div>`;
    });
    h+='</div>';
  }else h+='<div class="empty-fight">No bets on this fight yet</div>';
  return h+'</div>';
}
function renderLedger(bs,ar){
  if(!bs.length)return'<div class="lc"><div class="lt">No bets placed yet.</div></div>';
  let h=`<div class="lc"><div class="lt">All Bettors</div><div class="lr lh"><div class="ln">Name</div><div class="lp">Paid</div><div class="lw">Won</div><div class="lv">Net</div></div>`;
  bs.forEach(b=>{let nc='nc';if(ar){if(b.net>0)nc='gc';else if(b.net<0)nc='rc';}else if(b.net>0)nc='wc';const sg=b.net>0?'+':'',c=bettorColor(b.name);h+=`<div class="lr"><div class="ln"><span class="ld" style="background:${c}">${b.name.charAt(0).toUpperCase()}</span>${b.name}</div><div class="lp">$${b.paid}</div><div class="lw gc">$${b.won}</div><div class="lv ${nc}">${sg}$${Math.abs(b.net)}</div></div>`;});
  return h+'</div>';
}
function build(d){
  window._lastData=d;
  const fi=d.fights||[],be=d.bets||[],bo=d.bettors||[];
  const tp=d.totalPool||0,ar=d.allResolved||false,tb=new Set(be.map(b=>b.bettor)).size,tc=be.length,av=tc?Math.round(tp/tc):0;
  const rm=computeRanges(be,fi);
  const fs=fi.map(f=>{const fb=be.filter(b=>b.fightId===f.id),aB=fb.filter(b=>b.fighter==='A'),bB=fb.filter(b=>b.fighter==='B'),aT=aB.reduce((s,b)=>s+b.amount,0),bT=bB.reduce((s,b)=>s+b.amount,0),fT=aT+bT;return{f,aT,bT,fT,aP:fT?aT/fT*100:0,bP:fT?bT/fT*100:0,ac:aB.length,bc:bB.length,ab:aB,bb:bB};});
  return renderHero(tp,tb,tc,av,fi)+renderStatsRow(fs,bo)+renderBettorStrip(bo)+fs.map(f=>renderFightCard(f,rm)).join('')+renderLedger(bo,ar)+'<footer>Fight Night &middot; Refreshes every 15s</footer>';
}
// ── Bet Calculator Modal ────────────────────────────────────────
let modalState={fightId:0,probA:50,probB:50,nameA:'',nameB:'',colA:'',colB:'',pick:''};

function openBetCalc(){
  const fights=window._lastData?.fights||[];
  if(!fights.length)return;
  const sel=document.getElementById('modalFightSelect');
  sel.innerHTML='';
  fights.forEach(f=>{
    const opt=document.createElement('option');
    opt.value=f.id;
    opt.textContent=(f.title||f.nameA+' vs '+f.nameB);
    sel.appendChild(opt);
  });
  document.getElementById('betModal').style.display='flex';
  document.getElementById('modalResults').style.display='none';
  document.getElementById('modalWarnings').innerHTML='';
  modalState.pick='';
  modalFightChange();
}
function closeBetCalc(){
  document.getElementById('betModal').style.display='none';
}
function modalFightChange(){
  const sel=document.getElementById('modalFightSelect');
  const fid=parseInt(sel.value);
  const fights=window._lastData?.fights||[];
  const f=fights.find(x=>x.id===fid);
  if(!f)return;
  const ac=fcolor(f.nameA),bc=fcolor(f.nameB);
  modalState={fightId:fid,probA:f.probA,probB:f.probB,nameA:f.nameA,nameB:f.nameB,colA:ac,colB:bc,pick:''};
  document.getElementById('modalOdds').textContent=f.nameA+' ('+f.probA+'%)  vs  '+f.nameB+' ('+f.probB+'%)';
  document.getElementById('modalPickA').textContent=f.nameA;
  document.getElementById('modalPickA').style.borderColor='var(--border)';
  document.getElementById('modalPickA').style.background='var(--bg)';
  document.getElementById('modalPickB').textContent=f.nameB;
  document.getElementById('modalPickB').style.borderColor='var(--border)';
  document.getElementById('modalPickB').style.background='var(--bg)';
  document.getElementById('modalAmount').value=5;
  document.getElementById('modalResults').style.display='none';
  document.getElementById('modalWarnings').innerHTML='';
}
function modalPick(side){
  modalState.pick=side;
  const a=document.getElementById('modalPickA'),b=document.getElementById('modalPickB');
  const ca=modalState.colA,cb=modalState.colB;
  a.style.borderColor=side==='A'?ca:'var(--border)';
  a.style.background=side==='A'?ca+'22':'var(--bg)';
  b.style.borderColor=side==='B'?cb:'var(--border)';
  b.style.background=side==='B'?cb+'22':'var(--bg)';
  modalCalc();
}
function modalCalc(){
  if(!modalState.pick){document.getElementById('modalResults').style.display='none';return;}
  const amt=parseInt(document.getElementById('modalAmount').value)||0;
  if(amt<1){document.getElementById('modalResults').style.display='none';return;}
  const prob=modalState.pick==='A'?modalState.probA:modalState.probB;
  const pred=estWin(amt,prob);

  const allBets=window._lastData?.bets||[];
  const fights=window._lastData?.fights||[];
  const testBets=[...allBets,{bettor:'__test__',fightId:modalState.fightId,fighter:modalState.pick,amount:amt}];
  const ranges=computeRanges(testBets,fights);
  const r=ranges['__test__']||{min:0,max:0};

  document.getElementById('modalResults').style.display='block';
  document.getElementById('modalPred').textContent='~$'+pred;
  document.getElementById('modalRange').textContent='$'+r.min+' – $'+r.max;
  const totalPool=testBets.reduce((s,b)=>s+b.amount,0);
  document.getElementById('modalPool').textContent='$'+totalPool;

  let warns='';
  if(totalPool<20)warns+=`<div style="color:var(--gold);margin-top:4px">&#9888; Small pot — currently only $${totalPool} in the pool. It will grow as more people bet, increasing payouts.</div>`;
  const poolRatio=totalPool>0?amt/totalPool:0;
  if(poolRatio>0.3)warns+=`<div style="color:var(--gold);margin-top:4px">&#9888; Large bet — this would be ${Math.round(poolRatio*100)}% of the pool. You may not get your full payout.</div>`;
  if(amt>10)warns+=`<div style="color:var(--gold);margin-top:4px">&#9888; Over $10 — recommended max. Larger bets depend heavily on others for full payout.</div>`;
  if(prob>70)warns+=`<div style="color:var(--text-muted);margin-top:4px">&#9432; Safe pick — favorite with ${prob}% odds means smaller returns.</div>`;
  if(prob<30)warns+=`<div style="color:var(--text-muted);margin-top:4px">&#9432; Underdog pick — if they win, you get a bonus from the overflow pool.</div>`;
  if(r.max-r.min>20)warns+=`<div style="color:var(--text-muted);margin-top:4px">&#9432; Wide range — your payout varies significantly based on other fight results.</div>`;
  if(r.max<amt*0.9)warns+=`<div style="color:var(--gold);margin-top:4px">&#9888; Pool may not cover this bet — expected payout is less than your wager.</div>`;
  document.getElementById('modalWarnings').innerHTML=warns;
}

async function load(){
  const a=document.getElementById('app');
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/pool_state?id=eq.1&select=data',{headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
    if(!r.ok)throw Error('HTTP '+r.status);
    const j=await r.json();
    if(!j||!j.length)throw Error('Empty');
    const s=j[0].data;
    if(!s||s.offline===true){a.innerHTML='<div class="off"><div class="ei">&#128683;</div><h2>Feed Offline</h2><p>The admin hasn\'t started the feed.<br>Check back later.</p></div>';return;}
    a.innerHTML=build(s);
  }catch(e){a.innerHTML='<div class="off"><div class="ei">&#9888;</div><h2>Cannot Connect</h2><p style="font-size:.8rem;opacity:.6">'+e.message+'</p></div>';}
}
load();
setInterval(load,15000);
</script>
